name: Malaysia Water Watch
on:
  push:
    branches: [main]
    paths: ['modules/water-watch/**', 'industry/**', 'site/**', 'package*.json', '.github/workflows/water-watch.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run water:check && npm run water:test && npm run water:build
      - run: npx playwright install --with-deps chromium
      - run: node modules/water-watch/browser-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: malaysia-water-watch-preview
          path: .data/water-watch/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
